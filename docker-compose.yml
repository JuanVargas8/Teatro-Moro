
services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Caraluna.351
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  eureka:
    build: ./eureka
    ports:
      - "8761:8761"

  usuarios:
    build: ./ms-usuarios
    ports:
      - "9015:9015"
    depends_on:
      - postgres
      - eureka

  suscripciones:
    build: ./ms-suscripciones
    ports:
      - "9004:9004"
    depends_on:
      - postgres
      - eureka
      - usuarios


volumes:
  postgres_data: