services:
  # --- INFRAESTRUCTURA ---
  postgres:
    image: postgres:15
    container_name: postgres-rdbms
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: main_postgres_db
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - ./init-multi-db:/docker-entrypoint-initdb.d

